plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
}

group = 'com.xsyphon'
version = '1.2.1'
description = 'High-performance Unix nanosecond timestamp utilities for Java'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // JNA for native library access
    implementation 'net.java.dev.jna:jna:5.13.0'
    implementation 'net.java.dev.jna:jna-platform:5.13.0'
    
    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// Custom task to build native libraries
task buildNative(type: Exec) {
    group = 'build'
    description = 'Build native libraries'
    commandLine 'bash', 'scripts/build-native.sh'
    workingDir project.projectDir
    
    // Skip if property is set
    enabled = !project.hasProperty('skipNativeBuild')
}

// Make compileJava depend on buildNative
compileJava.dependsOn buildNative

// Copy native libraries to resources
task copyNativeLibs(type: Copy) {
    group = 'build'
    description = 'Copy native libraries to resources'
    from 'target/native'
    into 'build/resources/main/native'
    include '**/*.so', '**/*.dylib', '**/*.dll'
}

// Make processResources depend on copyNativeLibs
processResources.dependsOn copyNativeLibs
copyNativeLibs.dependsOn buildNative

// Configure JAR with Main Class
jar {
    manifest {
        attributes(
            'Main-Class': 'com.xsyphon.javaext.TimeXBenchmark',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'XSyphon',
            'Built-By': System.getProperty('user.name'),
            'Built-Date': new Date().toString()
        )
    }
    
    // Include native libraries in the JAR
    from('build/resources/main') {
        include 'native/**'
    }
}

// Fat JAR task for standalone execution
task fatJar(type: Jar) {
    group = 'build'
    description = 'Create a fat JAR with all dependencies'
    archiveClassifier = 'fat'
    
    // Strategy for handling duplicate files
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    manifest {
        attributes(
            'Main-Class': 'com.xsyphon.javaext.TimeXBenchmark',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'XSyphon'
        )
    }
    
    // Include dependency class files
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    
    // Include project's own files
    with jar
    
    // Exclude signature files and duplicate license files
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA' 
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/AL2.0'
    exclude 'META-INF/LGPL2.1'
    
    // Preserve necessary service files
    exclude { details ->
        details.file.name.endsWith('.kotlin_module') ||
        details.file.name.endsWith('.version') ||
        (details.path.startsWith('META-INF/') && 
         !details.path.startsWith('META-INF/services/'))
    }
}

// Make fatJar depend on jar
fatJar.dependsOn jar

// Jacoco coverage
jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Performance test task
task performanceTest(type: JavaExec) {
    group = 'verification'
    description = 'Run performance tests'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.xsyphon.javaext.PerformanceTest'
}

// Javadoc configuration
javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}

// Publishing configuration
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            pom {
                name = 'Java Extensions for Time Operations'
                description = 'High-performance Unix nanosecond timestamp utilities for Java'
                url = 'https://github.com/pinealctx/javaext'
                
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                
                developers {
                    developer {
                        id = 'pinealctx'
                        name = 'pinealctx'
                        email = 'pinealctx@example.com'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/pinealctx/javaext.git'
                    developerConnection = 'scm:git:ssh://github.com:pinealctx/javaext.git'
                    url = 'http://github.com/pinealctx/javaext/tree/main'
                }
            }
        }
    }
    
    repositories {
        maven {
            name = "OSSRH"
            url = uri(version.endsWith('SNAPSHOT') ? 
                "https://s01.oss.sonatype.org/content/repositories/snapshots/" : 
                "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/")
            credentials {
                username = findProperty("ossrhUsername") ?: System.getenv("OSSRH_USERNAME")
                password = findProperty("ossrhPassword") ?: System.getenv("OSSRH_PASSWORD")
            }
        }
    }
}

// Signing configuration
signing {
    def signingKey = findProperty("signingKey") ?: System.getenv("GPG_SIGNING_KEY")
    def signingPassword = findProperty("signingPassword") ?: System.getenv("GPG_SIGNING_PASSWORD")
    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.maven
    }
}

// Wrapper configuration
wrapper {
    gradleVersion = '8.4'
    distributionType = Wrapper.DistributionType.BIN
}
