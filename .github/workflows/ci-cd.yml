name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'corretto'

jobs:
  # Build and test on multiple platforms
  test:
    name: Test on ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            platform: linux
          - os: ubuntu-latest
            arch: arm64
            platform: linux
          - os: macos-latest
            arch: amd64
            platform: macos
          - os: macos-latest
            arch: arm64
            platform: macos
          - os: windows-latest
            arch: amd64
            platform: windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle

    - name: Install native build tools (Linux)
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make libc6-dev
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          sudo apt-get install -y gcc-aarch64-linux-gnu
        fi

    - name: Install native build tools (macOS)
      if: matrix.platform == 'macos'
      run: |
        xcode-select --install || true
        brew install make || true

    - name: Configure ARM64 cross-compilation (Linux)
      if: matrix.platform == 'linux' && matrix.arch == 'arm64'
      run: |
        echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Build with Maven
      run: |
        chmod +x scripts/build-native.sh
        if [ "${{ matrix.platform }}" = "windows" ]; then
          mvn clean compile -Pskip-native
        else
          mvn clean compile
        fi

    - name: Run tests with Maven
      run: mvn test

    - name: Build with Gradle
      run: |
        chmod +x gradlew
        if [ "${{ matrix.platform }}" = "windows" ]; then
          ./gradlew build -PskipNativeBuild=true
        else
          ./gradlew build
        fi

    - name: Run performance tests
      run: |
        if [ "${{ matrix.platform }}" != "windows" ]; then
          mvn exec:java -Dexec.mainClass="com.xsyphon.javaext.PerformanceTest"
        fi

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.platform }}-${{ matrix.arch }}
        path: |
          target/surefire-reports/
          build/test-results/
          target/native/
          build/libs/

    - name: Upload native libraries
      uses: actions/upload-artifact@v3
      if: matrix.platform != 'windows'
      with:
        name: native-libs-${{ matrix.platform }}-${{ matrix.arch }}
        path: |
          target/native/
          src/main/resources/native/

  # Build final artifacts with all native libraries
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}

    - name: Download all native libraries
      uses: actions/download-artifact@v3
      with:
        pattern: native-libs-*
        path: downloaded-libs/

    - name: Organize native libraries
      run: |
        mkdir -p src/main/resources/native
        find downloaded-libs/ -name "*.so" -o -name "*.dylib" | while read file; do
          # Extract platform and architecture from path
          platform=$(echo "$file" | grep -o 'linux\|macos')
          arch=$(echo "$file" | grep -o 'amd64\|arm64')
          if [ -n "$platform" ] && [ -n "$arch" ]; then
            mkdir -p "src/main/resources/native/$platform/$arch"
            cp "$file" "src/main/resources/native/$platform/$arch/"
          fi
        done
        find src/main/resources/native/ -type f

    - name: Build with Maven (skip native build)
      run: mvn clean package -Pskip-native

    - name: Build with Gradle (skip native build)
      run: |
        chmod +x gradlew
        ./gradlew build -PskipNativeBuild=true

    - name: Upload Maven artifacts
      uses: actions/upload-artifact@v3
      with:
        name: maven-artifacts
        path: target/*.jar

    - name: Upload Gradle artifacts
      uses: actions/upload-artifact@v3
      with:
        name: gradle-artifacts
        path: build/libs/*.jar

  # Publish to Maven Central
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    environment: release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}

    - name: Download release artifacts
      uses: actions/download-artifact@v3
      with:
        name: maven-artifacts
        path: target/

    - name: Download native libraries
      uses: actions/download-artifact@v3
      with:
        pattern: native-libs-*
        path: downloaded-libs/

    - name: Organize native libraries
      run: |
        mkdir -p src/main/resources/native
        find downloaded-libs/ -name "*.so" -o -name "*.dylib" | while read file; do
          platform=$(echo "$file" | grep -o 'linux\|macos')
          arch=$(echo "$file" | grep -o 'amd64\|arm64')
          if [ -n "$platform" ] && [ -n "$arch" ]; then
            mkdir -p "src/main/resources/native/$platform/$arch"
            cp "$file" "src/main/resources/native/$platform/$arch/"
          fi
        done

    - name: Import GPG key
      env:
        GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      run: |
        echo "$GPG_SIGNING_KEY" | base64 -d | gpg --batch --import

    - name: Publish to Maven Central
      env:
        OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
      run: |
        mvn clean deploy -Prelease -Pskip-native \
          -Dossrh.username="$OSSRH_USERNAME" \
          -Dossrh.password="$OSSRH_PASSWORD" \
          -Dgpg.keyname="$GPG_SIGNING_KEY" \
          -Dgpg.passphrase="$GPG_SIGNING_PASSWORD"

  # Create GitHub Release
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-release, publish]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Maven artifacts
      uses: actions/download-artifact@v3
      with:
        name: maven-artifacts
        path: artifacts/maven/

    - name: Download Gradle artifacts
      uses: actions/download-artifact@v3
      with:
        name: gradle-artifacts
        path: artifacts/gradle/

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## Changes in this Release
          
          This release includes:
          - High-performance Unix nanosecond timestamp utilities
          - Native libraries for Linux and macOS (AMD64 and ARM64)
          - JNI and JNA implementations
          - Comprehensive performance testing
          
          ### Artifacts
          - Maven JAR: Available in Maven Central
          - Gradle JAR: Available as release asset
          - Source code: Available as release asset
          
          ### Performance Results
          See the performance test results in the CI logs for detailed benchmarks.
        draft: false
        prerelease: false

    - name: Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: artifacts/gradle/javaext-*.jar
        asset_name: javaext-gradle.jar
        asset_content_type: application/java-archive
